<html lang="ko">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --nav-h: 80px; --pad-x: 5%; --line: rgba(255,255,255,0.07); }

    body {
      background: #040404; color: #fff;
      font-family: 'Open Sans','Noto Sans KR',sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    .nav {
      position: fixed; inset: 0 0 auto 0; z-index: 100;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding:  0 var(--pad-x) 0 20px;
      background: rgba(4,4,4,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo { text-decoration: none; display: flex; align-items: center; }
    .nav-logo img { height: 56px; width: auto; object-fit: contain; }
    .nav-links { display: flex; align-items: center; gap: clamp(16px,2.5vw,40px); list-style: none; }
    .nav-links a { font-size: clamp(12px,1.15vw,15px); font-weight: 400; letter-spacing: .06em; text-transform: uppercase; color: #fff; text-decoration: none; transition: color .15s; white-space: nowrap; }
    .nav-links a:hover { color: rgba(255,255,255,.8); }
    .nav-links a.active { color: #fff; }
    .nav-hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 10px;
      z-index: 21;
    }
    .nav-hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: #fff;
      transition: transform 0.28s ease, opacity 0.2s ease;
      transform-origin: center;
      border-radius: 1px;
    }
    .nav-hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

    /* ── MOBILE MENU ── */
    .mobile-menu { display: none; position: fixed; inset: 0; z-index: 90; background: rgba(4,4,4,.97); padding: calc(var(--nav-h) + 48px) var(--pad-x) 48px; opacity: 0; transition: opacity .3s; }
    .mobile-menu.open { opacity: 1; }
    .mobile-menu ul { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .mobile-menu a { font-size: clamp(28.98px,8.28vw,41.4px); font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: rgba(255,255,255,0.60); text-decoration: none; transition: color .15s; display: block; padding: 6px 0; }
    .mobile-menu a:hover, .mobile-menu a.active { color: #fff; }

    /* ── MAIN ── */
    .news-main { padding-top: var(--nav-h); }
    .split {
      display: grid; grid-template-columns: 360px 1fr;
      min-height: calc(100vh - var(--nav-h) - 52px);
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      border-right: 1px solid var(--line);
      padding: clamp(32px,4vw,56px) clamp(20px,2.5vw,36px) 32px var(--pad-x);
      position: sticky; top: var(--nav-h);
      height: calc(100vh - var(--nav-h));
      overflow: hidden; display: flex; flex-direction: column;
    }
    .eyebrow { font-size: 9.2px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,0.50); margin-bottom: 18px; }
    .title-wrap { display: flex; align-items: baseline; gap: 2px; margin-bottom: clamp(18px,2.2vw,28px); }
    .title-initial { font-size: clamp(43.7px,5.5vw,69px); font-weight: 800; letter-spacing: -0.06em; color: rgba(255,255,255,0.9); line-height: 0.85; }
    .title-rest { font-size: clamp(23px,2.8vw,34.5px); font-weight: 800; letter-spacing: -0.03em; color: rgba(255,255,255,0.55); padding-bottom: clamp(8px,1vw,14px); }
    .left-rule { width: 28px; height: 2px; background: rgba(255,255,255,.14); margin-bottom: clamp(14px,1.6vw,20px); }
    .left-desc { font-size: 13.2px; font-weight: 300; line-height: 2.05; color: rgba(255,255,255,0.60); word-break: keep-all; }
    .left-count { margin-top: auto; font-size: 9.8px; color: rgba(255,255,255,0.44); letter-spacing: .1em; }

    /* ── RIGHT PANEL ── */
    .right-panel { padding: clamp(24px,3vw,44px) var(--pad-x) 64px clamp(20px,2.5vw,36px); }

    /* ── CARD GRID ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      border: 1px solid var(--line);
    }

    /* ── NEWS CARD ── */
    .news-card {
      display: flex; flex-direction: column;
      padding: 0;
      text-decoration: none;
      border: none;
      background: transparent;
      transition: background .18s;
      position: relative;
    }
    .news-card::after {
      content: ''; position: absolute;
      inset: 0; border: 1px solid transparent;
      pointer-events: none; transition: border-color .18s;
    }
    .news-card:hover { background: rgba(255,255,255,0.03); }
    .news-card:hover::after { border-color: rgba(255,255,255,0.1); }

    /* ── CARD THUMBNAIL ── */
    .nc-thumb {
      width: 100%; aspect-ratio: 16/9;
      overflow: hidden; position: relative;
      background: #0c0c0c;
      flex-shrink: 0;
    }
    .nc-thumb::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, #0f0f0f 0%, #161616 100%);
      z-index: 0;
    }
    .nc-thumb img {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0; transition: opacity 0.35s ease;
      z-index: 1;
    }
    .nc-thumb img.loaded { opacity: 1; }
    .nc-thumb-loading {
      position: absolute; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
    }
    .nc-thumb-loading span {
      font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.15);
    }
    .nc-thumb-loading.done { display: none; }
    .nc-thumb-overlay {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
      height: 40%; background: linear-gradient(to top, rgba(4,4,4,0.7) 0%, transparent 100%);
    }
    .nc-body {
      padding: clamp(14px,1.6vw,22px);
      display: flex; flex-direction: column; flex: 1;
    }

    /* separator lines between cards */
    .card-grid { background: var(--line); }
    .news-card { background: #040404; }
    .news-card:hover { background: rgba(255,255,255,0.028); }

    .nc-meta {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px; margin-top: 2px;
    }
    .nc-tag {
      font-size: 8.1px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      color: rgba(255,255,255,0.60); border: 1px solid rgba(255,255,255,.12);
      padding: 2px 7px; flex-shrink: 0;
    }
    .nc-date { font-size: 9.2px; color: rgba(255,255,255,0.50); letter-spacing: .06em; }

    .nc-title {
      font-size: clamp(13.8px,1.4vw,16.1px); font-weight: 600;
      color: rgba(255,255,255,.76); line-height: 1.5;
      letter-spacing: -.01em; margin-bottom: 10px;
      word-break: keep-all;
      transition: color .18s;
      flex: 1;
    }
    .news-card:hover .nc-title { color: rgba(255,255,255,.95); }

    .nc-excerpt {
      font-size: 12.1px; font-weight: 300; line-height: 1.7;
      color: rgba(255,255,255,0.54); word-break: keep-all;
      margin-bottom: 14px; flex: 1;
    }

    .nc-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .nc-source { font-size: 10.4px; color: rgba(255,255,255,0.52); letter-spacing: .05em; }
    .nc-arrow {
      font-size: 12.7px; color: rgba(255,255,255,0.47);
      transition: color .18s, transform .18s;
    }
    .news-card:hover .nc-arrow { color: rgba(255,255,255,0.70); transform: translate(2px,-2px); }

    /* ── FOOTER ── */
    footer { height: 52px; border-top: 1px solid var(--line); padding: 0 var(--pad-x); display: flex; align-items: center; justify-content: space-between; }
    .ft { font-size: 11.5px; color: rgba(255,255,255,0.48); letter-spacing: .08em; }

    /* ── MOBILE ── */
    @media (max-width: 1024px) {
      :root { --pad-x: 4%; }
    }
    @media (max-width: 860px) {
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
      .split { grid-template-columns: 1fr; }
      .left-panel { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 24px var(--pad-x); }
      .left-desc, .left-count { display: none; }
      .right-panel { padding: 20px var(--pad-x) 48px; }
      .card-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .card-grid { grid-template-columns: 1fr; }
    }

    /* ── LANGUAGE TOGGLE ── */
    .nav-right {
      display: flex;
      align-items: center;
      gap: clamp(16px, 2.5vw, 32px);
    }
    .lang-toggle { position: relative; }
    .lang-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      transition: color 0.15s;
    }
    .lang-toggle-btn:hover { color: #fff; }
    .nav.solid .lang-toggle-btn { color: rgba(0,0,0,0.45); }
    .nav.solid .lang-toggle-btn:hover { color: #000; }
    .lang-dropdown {
      position: absolute;
      top: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%);
      min-width: 72px;
      list-style: none;
      margin: 0;
      background: rgba(4,4,4,0.92);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 0;
      display: none;
      flex-direction: column;
      z-index: 25;
    }
    .lang-dropdown.open { display: flex; }
    .nav.solid .lang-dropdown { background: rgba(255,255,255,0.98); border-color: #e3e3e3; }
    .lang-option {
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      padding: 6px 14px;
      font-size: clamp(11px, 1vw, 13px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .lang-option:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav.solid .lang-option { color: #555; }
    .nav.solid .lang-option:hover { color: #000; background: rgba(0,0,0,0.05); }

    .mobile-lang-toggle {
      position: absolute;
      bottom: 6%;
      left: var(--pad-x);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mobile-lang-toggle .lang-toggle-btn {
      color: rgba(255,255,255,0.5);
      font-size: clamp(11px, 1.4vw, 13px);
    }
    .mobile-lang-toggle .lang-dropdown {
      position: static;
      transform: none;
      flex-direction: row;
      min-width: 0;
    }
    .mobile-lang-toggle .lang-option {
      width: auto;
      padding: 6px 10px;
    }
    @media (max-width: 768px) {
      .lang-toggle { display: none; }
    }
  </style>
<script>if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(reg=>reg.unregister()));}</script>

  <script>

      { title:'지드래곤, 13년만에 베트남 공연…\'케이스타 스파크\' 출연 확정', excerpt:'지드래곤이 2012년 BIGBANG 활동 이후 약 13년 만에 베트남 무대에 선다. 6월 21일 하노이 미딘 국립경기장(4만 석)에서 열리는 K-STAR SPARK VIETNAM 2025 헤드라이너로 출연한다.', source:'뉴스1', date:'2025-05-14', city:'VIETNAM', url:'https://www.news1.kr/entertain/music/5782574' },

    function articleI18nSuffix() {
      var lang = document.documentElement.lang || 'ko';
      if (typeof I18N !== 'undefined' && I18N[lang] && I18N[lang].newsArticlesSuffix !== undefined) return I18N[lang].newsArticlesSuffix;
      return '건';
    }

    function refreshArticlesI18n(lang) {
      const translated = ARTICLE_I18N[lang];
      document.querySelectorAll('.news-card[data-article-index]').forEach(el => {
        const i = +el.getAttribute('data-article-index');
        const t = translated && translated[i];
        if (t) {
          el.querySelector('.nc-title').textContent = t.title;
          el.querySelector('.nc-excerpt').textContent = t.excerpt;
        } else {
          el.querySelector('.nc-title').textContent = ARTICLES[i].title;
          el.querySelector('.nc-excerpt').textContent = ARTICLES[i].excerpt;
        }
      });
      document.getElementById('art-count').textContent = ARTICLES.length + articleI18nSuffix();
    }

    document.getElementById('art-count').textContent = ARTICLES.length + articleI18nSuffix();

    // 캐시된 것과 새로 가져올 것 분리
    const usedImgUrls = new Set();
    const toFetch = [];

    ARTICLES.forEach((a, i) => {
      if (a.image) {
        // 하드코딩된 이미지 우선 사용
        usedImgUrls.add(a.image);
        setThumb(i, a.image, a.pos);
      } else if (cache[a.url]) {
        usedImgUrls.add(cache[a.url]);
        setThumb(i, cache[a.url]);
      } else {
        toFetch.push({ url: a.url, i });
      }
    });

    // 순서대로 fetch — 앞 결과를 보고 중복 판단 후 다음 처리
    (async () => {
      for (const { url, i } of toFetch) {
        await fetchAndResolve(url, i);
      }
    })();

    async function fetchAndResolve(url, i) {
      try {
        const data = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`)
          .then(r => r.json());

        const ogImg = data?.data?.image?.url;

        if (ogImg && !usedImgUrls.has(ogImg)) {
          // 새 이미지 → 바로 사용
          commit(url, i, ogImg);
        } else {
          // 중복이거나 OG 없음 → 기사 본문에서 다른 이미지 탐색
          const altImg = await fetchAltImage(url, ogImg);
          if (altImg) {
            commit(url, i, altImg);
          } else {
            // 완전 실패 → 로딩 제거
            document.getElementById(`thumb-loading-${i}`)?.classList.add('done');
          }
        }
      } catch {
        document.getElementById(`thumb-loading-${i}`)?.classList.add('done');
      }
    }

    async function fetchAltImage(url, skipUrl) {
      // microlink images 파라미터로 페이지 내 이미지 목록 요청
      try {
        const data = await fetch(
          `https://api.microlink.io?url=${encodeURIComponent(url)}&data.images.selector=img&data.images.attr=src&data.images.type=array`
        ).then(r => r.json());

        const images = data?.data?.images;
        if (Array.isArray(images)) {
          // OG와 다르고, 충분한 크기일 법한 첫 번째 이미지
          const alt = images.find(src =>
            typeof src === 'string' &&
            src !== skipUrl &&
            !usedImgUrls.has(src) &&
            /\.(jpg|jpeg|png|webp)/i.test(src) &&
            !src.includes('logo') &&
            !src.includes('icon') &&
            !src.includes('pixel') &&
            src.startsWith('http')
          );
          if (alt) return alt;
        }
      } catch { /* ignore */ }

      // 그래도 없으면 스크린샷으로 폴백
      try {
        const data = await fetch(
          `https://api.microlink.io?url=${encodeURIComponent(url)}&screenshot=true`
        ).then(r => r.json());
        const shot = data?.data?.screenshot?.url;
        if (shot && !usedImgUrls.has(shot)) return shot;
      } catch { /* ignore */ }

      return null;
    }

    function commit(url, i, imgUrl) {
      usedImgUrls.add(imgUrl);
      cache[url] = imgUrl;
      localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
      setThumb(i, imgUrl);
    }

    function setThumb(i, imgUrl, pos) {
      const img = document.getElementById(`thumb-img-${i}`);
      const loading = document.getElementById(`thumb-loading-${i}`);
      if (!img || !imgUrl) return;
      if (pos) img.style.objectPosition = pos;
      img.onload = () => { img.classList.add('loaded'); loading.classList.add('done'); };
      img.onerror = () => { loading.classList.add('done'); };
      img.src = imgUrl;
    }

    /* hamburger */
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      const isOpen = hamburger.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', isOpen);
      mobileMenu.setAttribute('aria-hidden', !isOpen);
      if (isOpen) { mobileMenu.style.display = 'flex'; requestAnimationFrame(() => mobileMenu.classList.add('open')); }
      else { mobileMenu.classList.remove('open'); mobileMenu.addEventListener('transitionend', () => { if (!mobileMenu.classList.contains('open')) mobileMenu.style.display = 'none'; }, { once: true }); }
    });
    mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      hamburger.classList.remove('open'); hamburger.setAttribute('aria-expanded','false');
      mobileMenu.classList.remove('open'); mobileMenu.setAttribute('aria-hidden','true');
      mobileMenu.addEventListener('transitionend', () => { mobileMenu.style.display = 'none'; }, { once: true });
    }));
  </script>

        var key = el.getAttribute('data-i18n-alt');
        if (I18N[lang] && I18N[lang][key] !== undefined) {
          el.setAttribute('alt', I18N[lang][key]);
        }
      });
    }

    function setLanguage(lang) {
      if (!LANG_LABELS[lang]) { lang = 'ko'; }
      document.documentElement.lang = lang;
      applyTranslations(lang);
      if (typeof refreshArticlesI18n === 'function') refreshArticlesI18n(lang);
      document.querySelectorAll('.lang-toggle-label').forEach(function (el) {
        el.textContent = LANG_LABELS[lang];
      });
      document.querySelectorAll('.lang-option').forEach(function (btn) {
        btn.closest('li').style.display = (btn.dataset.lang === lang) ? 'none' : '';
      });
      document.querySelectorAll('.lang-dropdown').forEach(function (dd) {
        dd.classList.remove('open');
      });
      document.querySelectorAll('.lang-toggle-btn').forEach(function (btn) {
        btn.setAttribute('aria-expanded', 'false');
      });
      localStorage.setItem('lang', lang);
    }

    document.querySelectorAll('.lang-toggle-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var dropdown = btn.nextElementSibling;
        var isOpen = dropdown.classList.toggle('open');
        btn.setAttribute('aria-expanded', isOpen);
      });
    });

    document.querySelectorAll('.lang-option').forEach(function (btn) {
      btn.addEventListener('click', function () { setLanguage(btn.dataset.lang); });
    });

    document.addEventListener('click', function () {
      document.querySelectorAll('.lang-dropdown.open').forEach(function (dd) { dd.classList.remove('open'); });
      document.querySelectorAll('.lang-toggle-btn[aria-expanded="true"]').forEach(function (btn) {
        btn.setAttribute('aria-expanded', 'false');
      });
    });

    var savedLang = localStorage.getItem('lang');
    if (savedLang && savedLang !== 'ko') setLanguage(savedLang);
  }());
</script>
</body>
</html>
