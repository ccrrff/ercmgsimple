<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ER CMG — ER Contents Media Group</title>
  <meta name="description" content="ER Contents Media Group — Live Entertainment, Media & Contents, Brand & Partnerships. Seoul, Korea.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #040404;
      color: #fff;
      font-family: 'Open Sans', 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden; /* hero only — no scroll on main page */
    }

    /* ── CSS VARIABLES ── */
    :root {
      --nav-h: 80px;
      --pad-x: 5%;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #040404;
    }

    /* VIDEO */
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.45);
    }

    /* GRAIN */
    .hero-grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* SCANLINES */
    .hero-scanlines {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.025) 3px,
        rgba(0, 0, 0, 0.025) 4px
      );
      pointer-events: none;
    }

    /* VIGNETTE */
    .hero-vignette {
      position: absolute;
      inset: 0;
      z-index: 4;
      background:
        radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0, 0, 0, 0.55) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 15%, transparent 75%, rgba(0,0,0,0.6) 100%),
        linear-gradient(to right, rgba(0,0,0,0.5) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
    }

    /* ── NAV ── */
    .nav {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding:  0 var(--pad-x) 0 20px;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .nav.solid {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid #e3e3e3;
    }

    /* LOGO */
    .nav-logo {
      text-decoration: none;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .nav-logo img {
      height: 56px;
      width: auto;
      object-fit: contain;
      transition: filter 0.2s ease;
    }
    .nav.solid .nav-logo img { filter: invert(1); }

    /* LINKS */
    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(16px, 2.5vw, 40px);
      list-style: none;
    }

    .nav-links a {
      font-size: clamp(12px, 1.15vw, 15px);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover { color: #fff; }

    .nav.solid .nav-links a { color: #555; }
    .nav.solid .nav-links a:hover { color: #000; }

    /* ── CORNER — BOTTOM RIGHT ── */
    .hero-corner-br {
      position: absolute;
      bottom: 6%;
      right: var(--pad-x);
      z-index: 15;
      font-size: clamp(7px, 0.85vw, 10px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.50);
      white-space: nowrap;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      :root { --pad-x: 4%; }
    }

    @media (min-width: 769px) {
      .hero-video { object-position: center 78%; }
    }



    /* ── HAMBURGER BUTTON ── */
    .nav-hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 10px;
      z-index: 21;
    }
    .nav-hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: #fff;
      transition: transform 0.28s ease, opacity 0.2s ease;
      transform-origin: center;
      border-radius: 1px;
    }
    .nav-hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

    /* ── MOBILE MENU OVERLAY ── */
    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 19;
      background: #040404;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 var(--pad-x);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .mobile-menu.open {
      opacity: 1;
    }
    .mobile-menu ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .mobile-menu a {
      font-size: clamp(25.2px, 7.2vw, 36px);
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.62);
      text-decoration: none;
      transition: color 0.15s;
      display: block;
      padding: 6px 0;
    }
    .mobile-menu a:hover { color: #fff; }

    @media (max-width: 768px) {
      /* Nav 링크 숨김 */
      .nav-links { display: none; }

      /* 햄버거 버튼 표시 */
      .nav-hamburger { display: flex; }

      /* 모바일 메뉴 활성화 */
      .mobile-menu { display: flex; }
    }

    @media (max-width: 480px) {
      /* 우하단 코너 숨김 — 모바일 최소화 */
      .hero-corner-br { display: none; }
    }

    /* ── FOOTER ── */
    .site-footer {
      position: relative; z-index: 20;
      height: 52px;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 0 var(--pad-x);
      display: flex; align-items: center; justify-content: space-between;
      background: #040404;
    }
    .ft { font-size: 10px; color: rgba(255,255,255,0.48); letter-spacing: 0.08em; }

    /* ── LANGUAGE TOGGLE ── */
    .nav-right {
      display: flex;
      align-items: center;
      gap: clamp(16px, 2.5vw, 32px);
    }
    .lang-toggle { position: relative; }
    .lang-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      transition: color 0.15s;
    }
    .lang-toggle-btn:hover { color: #fff; }
    .nav.solid .lang-toggle-btn { color: rgba(0,0,0,0.45); }
    .nav.solid .lang-toggle-btn:hover { color: #000; }
    .lang-dropdown {
      position: absolute;
      top: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%);
      min-width: 72px;
      list-style: none;
      margin: 0;
      background: rgba(4,4,4,0.92);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 0;
      display: none;
      flex-direction: column;
      z-index: 25;
    }
    .lang-dropdown.open { display: flex; }
    .nav.solid .lang-dropdown { background: rgba(255,255,255,0.98); border-color: #e3e3e3; }
    .lang-option {
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      padding: 6px 14px;
      font-size: clamp(11px, 1vw, 13px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .lang-option:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav.solid .lang-option { color: #555; }
    .nav.solid .lang-option:hover { color: #000; background: rgba(0,0,0,0.05); }

    .mobile-lang-toggle {
      position: absolute;
      bottom: 6%;
      left: var(--pad-x);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .mobile-lang-toggle .lang-toggle-btn {
      color: rgba(255,255,255,0.5);
      font-size: clamp(11px, 1.4vw, 13px);
    }
    .mobile-lang-toggle .lang-dropdown {
      position: static;
      transform: none;
      flex-direction: row;
      min-width: 0;
    }
    .mobile-lang-toggle .lang-option {
      width: auto;
      padding: 6px 10px;
    }
    @media (max-width: 768px) {
      .lang-toggle { display: none; }
    }
</style>
<script>if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(reg=>reg.unregister()));}</script>
</head>
<body>

  <!-- NAV -->
  <nav class="nav" id="nav" aria-label="주 메뉴" data-i18n-aria-label="navAriaLabel">

    <div class="nav-right">
      <ul class="nav-links">

        <li><a href="business.html" data-i18n="navBusiness">Business</a></li>
        <li><a href="ourworks.html" data-i18n="navOurWorks">Our Works</a></li>
        <li><a href="projects.html" data-i18n="navProjects">Projects</a></li>
        <li><a href="news.html" data-i18n="navNews">News</a></li>
        <li><a href="notice.html" data-i18n="navNotice">Notice</a></li>

        <button class="lang-toggle-btn" aria-haspopup="true" aria-expanded="false">

  <!-- MOBILE MENU -->

      <li><a href="aboutus.html" data-i18n="navAboutUs">About Us</a></li>
      <li><a href="business.html" data-i18n="navBusiness">Business</a></li>
      <li><a href="#" data-i18n="navOurWorks">Our Works</a></li>
      <li><a href="projects.html" data-i18n="navProjects">Projects</a></li>
      <li><a href="news.html" data-i18n="navNews">News</a></li>
      <li><a href="notice.html" data-i18n="navNotice">Notice</a></li>
      <li><a href="contact.html" data-i18n="navContact">Contact</a></li>
    </ul>
    <div class="mobile-lang-toggle">
      <button class="lang-toggle-btn" aria-haspopup="true" aria-expanded="false">
        <span class="lang-toggle-label">KO</span> ▾
      </button>
      <ul class="lang-dropdown" role="menu">
        <li role="menuitem" style="display:none"><button class="lang-option" data-lang="ko">KO</button></li>
        <li role="menuitem"><button class="lang-option" data-lang="en">EN</button></li>

  <!-- HERO -->
  <section class="hero" id="hero" aria-label="히어로" data-i18n-aria-label="heroAriaLabel">

    <!-- 1. VIDEO (z-index: 1) -->
    <video class="hero-video" autoplay muted loop playsinline>
      <source src="ercmgmainmovie.mp4" type="video/mp4">
    </video>

    <!-- 2. GRAIN (z-index: 2) -->

    <!-- 3. SCANLINES (z-index: 3) -->

    <!-- 4. VIGNETTE (z-index: 4) -->

    <!-- 7. CORNER — BOTTOM RIGHT (z-index: 15) -->

  </section>

  <footer class="site-footer">
    <span class="ft">© 2026 ER Contents Media Group</span>
    <span class="ft" data-i18n="footerLocation">Seoul, Korea</span>
  </footer>

  <script>
    const nav = document.getElementById('nav');
    const onScroll = () => nav.classList.toggle('solid', window.scrollY > 60);
    window.addEventListener('scroll', onScroll, { passive: true });

    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      const isOpen = hamburger.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', isOpen);
      mobileMenu.setAttribute('aria-hidden', !isOpen);
      if (isOpen) {
        mobileMenu.style.display = 'flex';
        requestAnimationFrame(() => mobileMenu.classList.add('open'));
      } else {
        mobileMenu.classList.remove('open');
        mobileMenu.addEventListener('transitionend', () => {
          if (!mobileMenu.classList.contains('open')) mobileMenu.style.display = 'none';
        }, { once: true });
      }
    });

    mobileMenu.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
        mobileMenu.classList.remove('open');
        mobileMenu.setAttribute('aria-hidden', 'true');
        mobileMenu.addEventListener('transitionend', () => {
          mobileMenu.style.display = 'none';
        }, { once: true });
      });
    });
  </script>

<script>
  const I18N = {
    ko: {
      navAboutUs: 'About Us', navBusiness: 'Business', navOurWorks: 'Our Works',
      navProjects: 'Projects', navNews: 'News', navNotice: 'Notice', navContact: 'Contact',
      heroCornerBr: 'Seoul · Est. 2018',
      footerLocation: 'Seoul, Korea',
      navAriaLabel: '주 메뉴', navHamburgerAriaLabel: '메뉴 열기', heroAriaLabel: '히어로',
    },
    en: {
      navAboutUs: 'About Us', navBusiness: 'Business', navOurWorks: 'Our Works',
      navProjects: 'Projects', navNews: 'News', navNotice: 'Notice', navContact: 'Contact',
      heroCornerBr: 'Seoul · Est. 2018',
      footerLocation: 'Seoul, Korea',
      navAriaLabel: 'Main menu', navHamburgerAriaLabel: 'Open menu', heroAriaLabel: 'Hero',
    },
    ja: {
      navAboutUs: '会社概要', navBusiness: '事業', navOurWorks: '制作実績',
      navProjects: 'プロジェクト', navNews: 'ニュース', navNotice: 'お知らせ', navContact: 'お問い合わせ',
      heroCornerBr: 'ソウル・2018年創業',
      footerLocation: '韓国・ソウル',
      navAriaLabel: 'メインメニュー', navHamburgerAriaLabel: 'メニューを開く', heroAriaLabel: 'ヒーロー',
    },
    zh: {
      navAboutUs: '关于我们', navBusiness: '业务', navOurWorks: '作品',
      navProjects: '项目', navNews: '新闻', navNotice: '公告', navContact: '联系我们',
      heroCornerBr: '首尔·2018年成立',
      footerLocation: '韩国首尔',
      navAriaLabel: '主菜单', navHamburgerAriaLabel: '打开菜单', heroAriaLabel: '主视觉',
    },
  };
</script>
<script>
  (function () {
    var LANG_LABELS = { ko: 'KO', en: 'EN', ja: 'JP', zh: 'CN' };

    function applyTranslations(lang) {
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (I18N[lang] && I18N[lang][key] !== undefined) {
          el.innerHTML = I18N[lang][key];
        }
      });
      document.querySelectorAll('[data-i18n-aria-label]').forEach(function (el) {
        var key = el.getAttribute('data-i18n-aria-label');
        if (I18N[lang] && I18N[lang][key] !== undefined) {
          el.setAttribute('aria-label', I18N[lang][key]);
        }
      });
      document.querySelectorAll('[data-i18n-alt]').forEach(function (el) {
        var key = el.getAttribute('data-i18n-alt');
        if (I18N[lang] && I18N[lang][key] !== undefined) {
          el.setAttribute('alt', I18N[lang][key]);
        }
      });
    }

    function setLanguage(lang) {
      if (!LANG_LABELS[lang]) { lang = 'ko'; }
      document.documentElement.lang = lang;
      applyTranslations(lang);
      document.querySelectorAll('.lang-toggle-label').forEach(function (el) {
        el.textContent = LANG_LABELS[lang];
      });
      document.querySelectorAll('.lang-option').forEach(function (btn) {
        btn.closest('li').style.display = (btn.dataset.lang === lang) ? 'none' : '';
      });
      document.querySelectorAll('.lang-dropdown').forEach(function (dd) {
        dd.classList.remove('open');
      });
      document.querySelectorAll('.lang-toggle-btn').forEach(function (btn) {
        btn.setAttribute('aria-expanded', 'false');
      });
      localStorage.setItem('lang', lang);
    }

    document.querySelectorAll('.lang-toggle-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var dropdown = btn.nextElementSibling;
        var isOpen = dropdown.classList.toggle('open');
        btn.setAttribute('aria-expanded', isOpen);
      });
    });

    document.querySelectorAll('.lang-option').forEach(function (btn) {
      btn.addEventListener('click', function () { setLanguage(btn.dataset.lang); });
    });

    document.addEventListener('click', function () {
      document.querySelectorAll('.lang-dropdown.open').forEach(function (dd) { dd.classList.remove('open'); });
      document.querySelectorAll('.lang-toggle-btn[aria-expanded="true"]').forEach(function (btn) {
        btn.setAttribute('aria-expanded', 'false');
      });
    });

    var savedLang = localStorage.getItem('lang');
    if (savedLang && savedLang !== 'ko') setLanguage(savedLang);
  }());
</script>
